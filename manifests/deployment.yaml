apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  selector:
    matchLabels:
      app: webapp
  replicas: 2
  template:
    metadata:
      labels:
        app: webapp
        release: "0"
    spec:
      containers:
      - name: webapp
        image: docker.io/library/fleetman-webapp:local
        imagePullPolicy: Never
